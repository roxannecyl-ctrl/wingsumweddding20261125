<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>2026.11.22 Angela & Vincent Wedding Day Hub v7</title>
<style>
  :root {
    --bg: #f6f4f0;
    --card: #ffffff;
    --ink: #1e1e1e;
    --muted: #6b6760;
    --accent: #8c5e3c;
    --accent-soft: #f2e8df;
    --ok: #2e7d5b;
    --ok-bg: #e7f5ee;
    --line: #e5e0d8;
    --tab-h: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang HK", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding-bottom: calc(var(--tab-h) + 24px);
    line-height: 1.45;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px 10px;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
  }
  .toolbar {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }
  .btn:active { opacity: 0.85; }
  .btn-secondary {
    background: var(--accent-soft);
    color: var(--accent);
  }
  main {
    padding: 14px 14px 0;
    max-width: 780px;
    margin: 0 auto;
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .stat-box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
  }
  .stat-num { font-size: 18px; font-weight: 700; color: var(--accent); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .chip {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
  }
  .chip.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }
  input[type="text"], input[type="number"], select {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
    background: #fff;
    color: var(--ink);
  }
  .row-item {
    border-top: 1px solid var(--line);
    padding: 10px 0;
  }
  .row-item:first-child { border-top: none; padding-top: 0; }
  .meta-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-right: 4px;
    font-weight: 600;
  }
  .duty-box {
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--bg);
    font-size: 12px;
  }
  .duty-box div { margin-bottom: 3px; }
  .guest-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 9px 0;
    border-top: 1px solid var(--line);
  }
  .guest-row:first-child { border-top: none; }
  .status-btn {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    background: #fff;
    color: var(--muted);
  }
  .status-btn.ok {
    background: var(--ok-bg);
    color: var(--ok);
    border-color: var(--ok);
  }
  .gold-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
  }
  .gold-pill {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    cursor: pointer;
  }
  .gold-pill.on {
    background: var(--ok-bg);
    color: var(--ok);
    border-color: var(--ok);
    font-weight: 600;
  }
  nav.tabbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--tab-h);
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    z-index: 30;
  }
  nav.tabbar button {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
  }
  nav.tabbar button.active { color: var(--accent); }
  .done-text { text-decoration: line-through; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>2026.11.22 Angela & Vincent Wedding Hub</h1>
    <span class="badge">黃金海岸酒店 → 遊艇會</span>
  </div>
  <div class="toolbar">
    <button class="btn btn-secondary" onclick="exportJSON()">匯出備份 JSON</button>
    <button class="btn btn-secondary" onclick="resetState()">還原 Excel 預設資料</button>
    <span id="saveStatus">已自動儲存至本機</span>
  </div>
</header>

<main>
  <!-- TAB 1: RUNDOWN -->
  <section id="tab-rundown" class="panel active">
    <div class="card">
      <h2>Whole Day Rundown（拍攝：White Production）</h2>
      <div class="filter-row" id="rundownFilters"></div>
      <div id="rundownContainer"></div>
    </div>
  </section>

  <!-- TAB 2: SEATING PLAN -->
  <section id="tab-seating" class="panel">
    <div class="stats-grid" id="seatingStats"></div>
    <div class="card">
      <h2>新增座位／臨時加人</h2>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <input type="text" id="newGuestName" placeholder="賓客姓名" style="flex:1; min-width:120px;">
        <select id="newGuestTable">
          <option value="T.1 (Garden Room)">T.1 (Garden Room)</option>
          <option value="T.2 (Garden Room)">T.2 (Garden Room)</option>
          <option value="T.3 (Garden Room)">T.3 (Garden Room)</option>
          <option value="T.5 (Garden Room)">T.5 (Garden Room)</option>

          <option value="T.8 (The Deck)">T.8 (The Deck)</option>
          <option value="T.9 (The Deck)">T.9 (The Deck)</option>
          <option value="T.10 (The Deck)">T.10 (The Deck)</option>
          <option value="T.11 (The Deck)">T.11 (The Deck)</option>
        </select>
        <select id="newGuestSide">
          <option value="男家">男家</option>
          <option value="女家">女家</option>
          <option value="未標明">未標明</option>
        </select>
        <input type="number" id="newGuestAmt" placeholder="人情 ($)" style="width:95px;">
        <button class="btn" onclick="addGuest()">新增</button>
      </div>
    </div>
    <div class="card">
      <h2>Seating Plan V5 賓客名單</h2>
      <div style="display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;">
        <input type="text" id="seatingSearch" placeholder="搜尋姓名或枱號..." oninput="renderSeating()" style="flex:1; min-width:150px;">
        <div class="filter-row" id="tableFilterChips" style="margin-bottom:0;"></div>
      </div>
      <div id="seatingContainer"></div>
    </div>
  </section>

  <!-- TAB 3: 奉茶 LIST & 大合照 LIST -->
  <section id="tab-ceremony" class="panel">
    <div class="card">
      <h2>奉茶組合List（奉茶紀錄表）</h2>
      <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">
        建議預備號碼小貼紙（每個號碼約 6-8 個）貼於奉茶時收到的金器或利是上。
      </div>
      <div id="teaContainer"></div>
    </div>
    <div class="card">
      <h2>大合照List（敬酒大合照名單）</h2>
      <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">
        列出預計人數（不計算新人），方便場地工作人員安排台上座椅數目。
      </div>
      <div id="photoContainer"></div>
    </div>
  </section>

  <!-- TAB 4: 物資表 -->
  <section id="tab-materials" class="panel">
    <div class="card">
      <h2>物資表（按流程及崗位整合）</h2>
      <div style="display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;">
        <input type="text" id="newMatItem" placeholder="新增物資名稱..." style="flex:1; min-width:140px;">
        <input type="text" id="newMatOwner" placeholder="負責人" style="width:110px;">
        <button class="btn" onclick="addMaterial()">新增</button>
      </div>
      <div id="materialsContainer"></div>
    </div>
  </section>

  <!-- TAB 5: 人情／金器匯總 -->
  <section id="tab-angpao" class="panel">
    <div class="stats-grid" id="angpaoStats"></div>
    <div class="card">
      <h2>人情登記明細（同步 Seating Plan）</h2>
      <div id="angpaoContainer"></div>
    </div>
  </section>
</main>

<nav class="tabbar">

</nav>

let state = loadState();
let activeRundownPhase = "ALL";
let activeTableFilter = "ALL";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return JSON.parse(JSON.stringify(INITIAL_DATA));
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const el = document.getElementById("saveStatus");
  if (el) {
    const now = new Date();
    el.textContent = "已儲存 " + now.toTimeString().slice(0,8);
  }
}

function resetState() {
  if (!confirm("確定還原為 Excel 預設資料？（本機勾選與人情紀錄會重設）")) return;
  localStorage.removeItem(STORAGE_KEY);
  state = JSON.parse(JSON.stringify(INITIAL_DATA));
  renderAll();
  saveState();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "wedding_1122_backup.json";
  a.click();
  URL.revokeObjectURL(url);
}

function switchTab(tab, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");
  if (btn) btn.classList.add("active");
  if (tab === "angpao") renderAngpao();
}

function renderRundown() {
  const filterWrap = document.getElementById("rundownFilters");
  const phases = ["ALL", ...state.rundown.map(s => s.phase)];
  filterWrap.innerHTML = phases.map(p =>
    `<button class="chip ${activeRundownPhase===p?'active':''}" onclick="activeRundownPhase='${p.replace(/'/g,"\\'")}';renderRundown()">${p==='ALL'?'全部時段':p}</button>`
  ).join("");

  const container = document.getElementById("rundownContainer");
  const sections = state.rundown.filter(s => activeRundownPhase === "ALL" || s.phase === activeRundownPhase);
  container.innerHTML = sections.map((sec, sIdx) => `
    <div style="margin-bottom:14px;">
      <div style="font-weight:700; font-size:13px; color:var(--accent); margin-bottom:6px;">${sec.phase}</div>
      ${sec.items.map((it, iIdx) => `
        <div class="row-item">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div>
              <span class="meta-tag">${it.time}</span>
              <span class="${it.done?'done-text':''}" style="font-weight:600; font-size:13px;">${it.text.replace(/\n/g, '<br>')}</span>
            </div>
            <button class="status-btn ${it.done?'ok':''}" onclick="toggleRundownDone(${sIdx}, ${iIdx})">${it.done?'已完成':'待完成'}</button>
          </div>
          ${it.material ? `<div style="font-size:12px; color:var(--muted); margin-top:4px;">物資／備註：${it.material.replace(/\n/g, '；')}</div>` : ''}
          ${(it.sister.length || it.brother.length) ? `
            <div class="duty-box">
              ${it.sister.map(x => `<div>👩 姊妹：${x.replace(/\n/g, ' ')}</div>`).join("")}
              ${it.brother.map(x => `<div>👨 兄弟：${x.replace(/\n/g, ' ')}</div>`).join("")}
            </div>
          ` : ''}
        </div>
      `).join("")}
    </div>
  `).join("");
}

function toggleRundownDone(sIdx, iIdx) {
  const sec = state.rundown.filter(s => activeRundownPhase === "ALL" || s.phase === activeRundownPhase)[sIdx];
  sec.items[iIdx].done = !sec.items[iIdx].done;
  saveState();
  renderRundown();
}

function renderSeating() {
  const total = state.seating.length;
  const arrived = state.seating.filter(g => g.checkin === "已經到").length;
  const tables = [...new Set(state.seating.map(g => g.table))];
  const totalAmt = state.seating.reduce((acc, g) => acc + (parseFloat(g.amount) || 0), 0);

  document.getElementById("seatingStats").innerHTML = `
    <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-lbl">入座人數</div></div>
    <div class="stat-box"><div class="stat-num">${arrived}</div><div class="stat-lbl">已經到</div></div>
    <div class="stat-box"><div class="stat-num">${tables.length}</div><div class="stat-lbl">圍數</div></div>
    <div class="stat-box"><div class="stat-num">$${totalAmt.toLocaleString()}</div><div class="stat-lbl">已填人情</div></div>
  `;

  const chipWrap = document.getElementById("tableFilterChips");
  chipWrap.innerHTML = ["ALL", ...tables].map(t =>
    `<button class="chip ${activeTableFilter===t?'active':''}" onclick="activeTableFilter='${t}';renderSeating()">${t==='ALL'?'全部枱':t.split(' ')[0]}</button>`
  ).join("");

  const q = (document.getElementById("seatingSearch")?.value || "").trim().toLowerCase();
  const filtered = state.seating.filter(g => {
    const matchTbl = activeTableFilter === "ALL" || g.table === activeTableFilter;
    const matchQ = !q || g.name.toLowerCase().includes(q) || g.table.toLowerCase().includes(q);
    return matchTbl && matchQ;
  });

  document.getElementById("seatingContainer").innerHTML = filtered.map(g => `
    <div class="guest-row">
      <div>
        <div style="font-weight:600; font-size:13px;">${g.name}</div>
        <div style="font-size:11px; color:var(--muted);">${g.table} · ${g.side}</div>
      </div>
      <div style="display:flex; gap:6px; align-items:center;">
        <input type="number" placeholder="$ 人情" value="${g.amount}" style="width:82px; padding:5px 7px; font-size:12px;"
               onchange="updateGuestAmt('${g.id}', this.value)">
        <button class="status-btn ${g.checkin==='已經到'?'ok':''}" onclick="toggleCheckin('${g.id}')">
          ${g.checkin}
        </button>
      </div>
    </div>
  `).join("");
}

function toggleCheckin(id) {
  const g = state.seating.find(x => x.id === id);
  if (!g) return;
  g.checkin = g.checkin === "已經到" ? "未到" : "已經到";
  saveState();
  renderSeating();
}

function updateGuestAmt(id, val) {
  const g = state.seating.find(x => x.id === id);
  if (!g) return;
  g.amount = val;
  saveState();
  renderSeating();
}

function addGuest() {
  const name = document.getElementById("newGuestName").value.trim();
  if (!name) return;
  const table = document.getElementById("newGuestTable").value;
  const side = document.getElementById("newGuestSide").value;
  const amount = document.getElementById("newGuestAmt").value;
  state.seating.unshift({
    id: "s_custom_" + Date.now(),
    name, table, side, checkin: "未到", amount
  });
  document.getElementById("newGuestName").value = "";
  document.getElementById("newGuestAmt").value = "";
  saveState();
  renderSeating();
}

      <div><strong>${g.name}</strong> <span style="font-size:11px; color:var(--muted);">(${g.table} · ${g.side})</span></div>
      <div style="font-weight:700; color:var(--accent);">$${Number(g.amount).toLocaleString()}</div>
    </div>
  `).join("") : `<div style="font-size:12px; color:var(--muted);">尚未填寫人情金額，可在 Seating 分頁直接輸入。</div>`;
}

function renderAll() {
  renderRundown();
  renderSeating();
  renderTeaAndPhoto();
  renderMaterials();
  renderAngpao();
}

renderAll();
</script>
</body>
</html>
