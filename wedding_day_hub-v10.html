<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wedding Day Hub v10 (1122)</title>
  <style>
    :root {
      --bg: #faf7f4;
      --card: #ffffff;
      --ink: #241e1a;
      --muted: #75685f;
      --accent: #9e6b53;
      --accent-soft: #f3e8e1;
      --ok: #2e7d5b;
      --ok-soft: #e6f4ee;
      --warn: #8c5a2b;
      --warn-soft: #fdf1e6;
      --border: #e8ddd5;
      --nav-h: 68px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: calc(var(--nav-h) + 24px);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(250, 247, 244, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { font-size: 16px; font-weight: 700; }
    .brand small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
    .save-badge {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--ok-soft);
      color: var(--ok);
      font-weight: 600;
      white-space: nowrap;
    }
    main { padding: 14px 16px 24px; max-width: 760px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(36, 30, 26, 0.03);
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .item-row:last-child { border-bottom: none; }
    .item-title { font-size: 14px; font-weight: 600; }
    .item-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .empty-tip {
      padding: 14px;
      border-radius: 10px;
      background: var(--bg);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .status-btn { min-width: 82px; text-align: center; }
    .status-btn.arrived { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
    .status-btn.pending { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
    .pill {
      display: inline-block;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 10px;
      background: #fff;
      font-family: inherit;
    }
    textarea { min-height: 110px; font-size: 12px; }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .err-text { color: #b42318; font-size: 12px; margin-top: 6px; min-height: 18px; }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--nav-h);
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 30;
    }
    .nav-btn {
      border: none;
      border-radius: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 2px;
      font-size: 11px;
      color: var(--muted);
    }
    .nav-btn.active { color: var(--accent); background: var(--accent-soft); }
    .nav-icon { font-size: 16px; line-height: 1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      Wedding 1122 Hub <span class="pill">v10</span>
      <small id="activeTabLabel">目前分頁：Rundown</small>
    </div>
    <div id="saveTimestamp" class="save-badge">已儲存：尚未變更</div>
  </header>

  <main>
    <!-- 1. Rundown -->
    <section id="panel-rundown" class="tab-panel active">
      <div class="card">
        <h2>
          <span>Rundown 流程表</span>
          <span id="rundownCount" class="pill"></span>
        </h2>
        <div id="rundownList"></div>
      </div>

      <div class="card">
        <h2>快速新增／貼上 Master 2 資料</h2>
        <div class="item-sub" style="margin-bottom:8px;">
          可直接貼上 JSON（支援 <code>rundown</code>、<code>seating</code>、<code>tea</code>、<code>supplies</code>、<code>angbao</code> 陣列），或逐筆新增流程。
        </div>
        <div class="row-actions" style="margin-bottom:8px;">
          <input type="text" id="rdTimeInput" placeholder="時間 (例: 18:00)" style="flex:1; min-width:110px; margin-bottom:0;" />
          <input type="text" id="rdTitleInput" placeholder="流程項目" style="flex:2; min-width:150px; margin-bottom:0;" />
          <input type="text" id="rdNoteInput" placeholder="備註／負責人" style="flex:2; min-width:150px; margin-bottom:0;" />
          <button type="button" class="primary" id="addRundownBtn">新增流程</button>
        </div>
        <textarea id="masterJsonInput" placeholder='貼上 Wedding 1122 - Master_2 匯出 JSON，例如：{"seating":[{"id":"s1","name":"賓客姓名","table":"Table 1","status":"未到"}]}'></textarea>
        <div class="row-actions">
          <button type="button" class="primary" id="importJsonBtn">匯入並儲存資料</button>
          <button type="button" id="resetDataBtn">清空全部資料</button>
        </div>
        <div id="importMsg" class="err-text"></div>
      </div>
    </section>

    <!-- 2. Seating (No Password) -->
    <section id="panel-seating" class="tab-panel">
      <div class="card">
        <h2>
          <span>Seating 座位表</span>
          <span id="seatingSummary" class="pill"></span>
        </h2>
        <div class="item-sub" style="margin-bottom:8px;">無需密碼即可查閱，點擊右側按鈕可切換「未到／已經到」。</div>
        <div class="row-actions" style="margin-bottom:10px;">
          <input type="text" id="seatNameInput" placeholder="賓客姓名" style="flex:2; min-width:130px; margin-bottom:0;" />
          <input type="text" id="seatTableInput" placeholder="桌號" style="flex:1; min-width:90px; margin-bottom:0;" />
          <button type="button" class="primary" id="addSeatBtn">新增賓客</button>
        </div>
        <div id="seatingList"></div>
      </div>
    </section>

    <!-- 3. 奉茶／合照 -->
    <section id="panel-tea" class="tab-panel">
      <div class="card">
        <h2>
          <span>奉茶／合照清單</span>
          <span id="teaSummary" class="pill"></span>
        </h2>
        <div class="row-actions" style="margin-bottom:10px;">
          <input type="text" id="teaTitleInput" placeholder="新增奉茶／合照項目" style="flex:1; min-width:180px; margin-bottom:0;" />
          <button type="button" class="primary" id="addTeaBtn">新增項目</button>
        </div>
        <div id="teaList"></div>
      </div>
    </section>

    <!-- 4. 物資表 -->
    <section id="panel-supplies" class="tab-panel">
      <div class="card">
        <h2>
          <span>物資表</span>
          <span id="suppliesSummary" class="pill"></span>
        </h2>
        <div class="row-actions" style="margin-bottom:10px;">
          <input type="text" id="supplyTitleInput" placeholder="新增物資項目" style="flex:1; min-width:180px; margin-bottom:0;" />
          <button type="button" class="primary" id="addSupplyBtn">新增物資</button>
        </div>
        <div id="suppliesList"></div>
      </div>
    </section>

    <!-- 5. 人情 (Password Lock: 1122) -->
    <section id="panel-angbao" class="tab-panel">
      <div id="angbaoLockBox" class="card">
        <h2>人情分頁（密碼鎖）</h2>
        <div class="item-sub" style="margin-bottom:10px;">此分頁已上鎖，請輸入密碼解鎖。</div>
        <input type="password" id="angbaoPassInput" inputmode="numeric" maxlength="10" placeholder="請輸入解鎖密碼" />
        <div class="row-actions">
          <button type="button" class="primary" id="unlockAngbaoBtn">解鎖人情分頁</button>
        </div>
        <div id="angbaoErr" class="err-text"></div>
      </div>

      <div id="angbaoContentBox" class="card" style="display:none;">
        <h2>
          <span>人情紀錄</span>
          <button type="button" id="lockAngbaoBtn">重新上鎖</button>
        </h2>
        <input type="text" id="angbaoNameInput" placeholder="賓客姓名" />
        <input type="number" id="angbaoAmountInput" placeholder="人情金額 (HKD)" />
        <div class="row-actions" style="margin-bottom:10px;">
          <button type="button" class="primary" id="addAngbaoBtn">新增紀錄</button>
        </div>
        <div id="angbaoList"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="底部導覽列">
    <button type="button" class="nav-btn active" data-tab="rundown">
      <span class="nav-icon">📋</span><span>Rundown</span>
    </button>
    <button type="button" class="nav-btn" data-tab="seating">
      <span class="nav-icon">🪑</span><span>Seating</span>
    </button>
    <button type="button" class="nav-btn" data-tab="tea">
      <span class="nav-icon">🍵</span><span>奉茶／合照</span>
    </button>
    <button type="button" class="nav-btn" data-tab="supplies">
      <span class="nav-icon">📦</span><span>物資表</span>
    </button>
    <button type="button" class="nav-btn" data-tab="angbao">
      <span class="nav-icon">🧧</span><span>人情</span>
    </button>
  </nav>

  <script>
    (function () {
      const STORAGE_KEY = "wedding_day_hub_v10_1122_state";
      const ANP_PASS = "1122";
      const TAB_NAMES = {
        rundown: "Rundown",
        seating: "Seating",
        tea: "奉茶／合照",
        supplies: "物資表",
        angbao: "人情"
      };

      const emptyState = {
        activeTab: "rundown",
        angbaoUnlocked: false,
        lastSaved: "",
        rundown: [],
        seating: [],
        tea: [],
        supplies: [],
        angbao: []
      };

      function sanitizeText(str) {
        return String(str || "").replace(/\n/g, " ").trim();
      }

      function formatNow() {
        const now = new Date();
        return [now.getHours(), now.getMinutes(), now.getSeconds()]
          .map(function (n) { return String(n).padStart(2, "0"); })
          .join(":");
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return JSON.parse(JSON.stringify(emptyState));
          const parsed = JSON.parse(raw);
          return Object.assign({}, JSON.parse(JSON.stringify(emptyState)), parsed);
        } catch (e) {
          return JSON.parse(JSON.stringify(emptyState));
        }
      }

      let state = loadState();

      function updateSaveBadge() {
        const badge = document.getElementById("saveTimestamp");
        if (!badge) return;
        badge.textContent = state.lastSaved ? "已儲存：" + state.lastSaved : "已儲存：尚未變更";
      }

      function saveState() {
        state.lastSaved = formatNow();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          // ignore storage quota errors
        }
        updateSaveBadge();
      }

      function renderRundown() {
        const container = document.getElementById("rundownList");
        const countEl = document.getElementById("rundownCount");
        if (!container) return;
        if (countEl) countEl.textContent = state.rundown.length + " 項";

        if (!state.rundown.length) {
          container.innerHTML = '<div class="empty-tip">尚未匯入 Rundown 流程資料，請貼上 Master_2 資料或於下方新增。</div>';
          return;
        }

        container.innerHTML = state.rundown.map(function (item) {
          return (
            '<div class="item-row">' +
            '<div><div class="item-title">' + sanitizeText(item.time) + " · " + sanitizeText(item.title) + "</div>" +
            '<div class="item-sub">' + sanitizeText(item.note) + "</div></div>" +
            "</div>"
          );
        }).join("");
      }

      function renderSeating() {
        const container = document.getElementById("seatingList");
        const summary = document.getElementById("seatingSummary");
        if (!container) return;

        const arrivedCount = state.seating.filter(function (g) { return g.status === "已經到"; }).length;
        if (summary) summary.textContent = "已到 " + arrivedCount + " / " + state.seating.length;

        if (!state.seating.length) {
          container.innerHTML = '<div class="empty-tip">尚未匯入 Seating 賓客名單，請從 Rundown 分頁貼上 Master_2 資料或於上方新增。</div>';
          return;
        }

        container.innerHTML = state.seating.map(function (guest) {
          const isArrived = guest.status === "已經到";
          const btnClass = isArrived ? "status-btn arrived" : "status-btn pending";
          return (
            '<div class="item-row">' +
            '<div><div class="item-title">' + sanitizeText(guest.name) + "</div>" +
            '<div class="item-sub">桌號：' + sanitizeText(guest.table) + "</div></div>" +
            '<button type="button" class="' + btnClass + '" data-seating-id="' + sanitizeText(guest.id) + '">' +
            sanitizeText(guest.status || "未到") +
            "</button>" +
            "</div>"
          );
        }).join("");
      }

      function renderTea() {
        const container = document.getElementById("teaList");
        const summary = document.getElementById("teaSummary");
        if (!container) return;

        const doneCount = state.tea.filter(function (t) { return !!t.done; }).length;
        if (summary) summary.textContent = "已完成 " + doneCount + " / " + state.tea.length;

        if (!state.tea.length) {
          container.innerHTML = '<div class="empty-tip">尚未匯入奉茶／合照資料。</div>';
          return;
        }

        container.innerHTML = state.tea.map(function (item) {
          return (
            '<div class="item-row">' +
            '<div class="item-title">' + sanitizeText(item.title) + "</div>" +
            '<button type="button" class="status-btn ' + (item.done ? "arrived" : "pending") + '" data-tea-id="' + sanitizeText(item.id) + '">' +
            (item.done ? "已完成" : "待進行") +
            "</button>" +
            "</div>"
          );
        }).join("");
      }

      function renderSupplies() {
        const container = document.getElementById("suppliesList");
        const summary = document.getElementById("suppliesSummary");
        if (!container) return;

        const checkedCount = state.supplies.filter(function (s) { return !!s.checked; }).length;
        if (summary) summary.textContent = "已備妥 " + checkedCount + " / " + state.supplies.length;

        if (!state.supplies.length) {
          container.innerHTML = '<div class="empty-tip">尚未匯入物資表資料。</div>';
          return;
        }

        container.innerHTML = state.supplies.map(function (item) {
          return (
            '<div class="item-row">' +
            '<div class="item-title">' + sanitizeText(item.title) + "</div>" +
            '<button type="button" class="status-btn ' + (item.checked ? "arrived" : "pending") + '" data-supply-id="' + sanitizeText(item.id) + '">' +
            (item.checked ? "已備妥" : "未備妥") +
            "</button>" +
            "</div>"
          );
        }).join("");
      }

      function renderAngbao() {
        const lockBox = document.getElementById("angbaoLockBox");
        const contentBox = document.getElementById("angbaoContentBox");
        const listEl = document.getElementById("angbaoList");
        if (!lockBox || !contentBox || !listEl) return;

        lockBox.style.display = state.angbaoUnlocked ? "none" : "block";
        contentBox.style.display = state.angbaoUnlocked ? "block" : "none";

        if (!state.angbao.length) {
          listEl.innerHTML = '<div class="empty-tip">尚未匯入人情紀錄。</div>';
          return;
        }

        listEl.innerHTML = state.angbao.map(function (row) {
          return (
            '<div class="item-row">' +
            '<div class="item-title">' + sanitizeText(row.name) + "</div>" +
            '<div class="pill">HKD ' + Number(row.amount || 0).toLocaleString() + "</div>" +
            "</div>"
          );
        }).join("");
      }

      function renderAll() {
        renderRundown();
        renderSeating();
        renderTea();
        renderSupplies();
        renderAngbao();
        updateSaveBadge();
      }

      function switchTab(tabKey) {
        if (!TAB_NAMES[tabKey]) return;
        state.activeTab = tabKey;

        document.querySelectorAll(".tab-panel").forEach(function (panel) {
          panel.classList.remove("active");
        });
        const targetPanel = document.getElementById("panel-" + tabKey);
        if (targetPanel) targetPanel.classList.add("active");

        document.querySelectorAll(".nav-btn").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-tab") === tabKey);
        });

        const label = document.getElementById("activeTabLabel");
        if (label) label.textContent = "目前分頁：" + TAB_NAMES[tabKey];

        saveState();
      }

      function bindEvents() {
        document.querySelectorAll(".nav-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            switchTab(btn.getAttribute("data-tab"));
          });
        });

        document.getElementById("addRundownBtn").addEventListener("click", function () {
          const timeEl = document.getElementById("rdTimeInput");
          const titleEl = document.getElementById("rdTitleInput");
          const noteEl = document.getElementById("rdNoteInput");
          const title = sanitizeText(titleEl && titleEl.value);
          if (!title) return;
          state.rundown.push({
            id: "rd_" + Date.now(),
            time: sanitizeText(timeEl && timeEl.value),
            title: title,
            note: sanitizeText(noteEl && noteEl.value)
          });
          timeEl.value = "";
          titleEl.value = "";
          noteEl.value = "";
          renderRundown();
          saveState();
        });

        document.getElementById("importJsonBtn").addEventListener("click", function () {
          const box = document.getElementById("masterJsonInput");
          const msg = document.getElementById("importMsg");
          try {
            const incoming = JSON.parse(box.value);
            ["rundown", "seating", "tea", "supplies", "angbao"].forEach(function (key) {
              if (Array.isArray(incoming[key])) {
                state[key] = incoming[key];
              }
            });
            renderAll();
            saveState();
            if (msg) msg.textContent = "已成功匯入並儲存資料。";
          } catch (e) {
            if (msg) msg.textContent = "JSON 格式有誤，請檢查括號與引號。";
          }
        });

        document.getElementById("resetDataBtn").addEventListener("click", function () {
          state.rundown = [];
          state.seating = [];
          state.tea = [];
          state.supplies = [];
          state.angbao = [];
          renderAll();
          saveState();
        });

        document.getElementById("addSeatBtn").addEventListener("click", function () {
          const nameEl = document.getElementById("seatNameInput");
          const tableEl = document.getElementById("seatTableInput");
          const name = sanitizeText(nameEl && nameEl.value);
          if (!name) return;
          state.seating.push({
            id: "s_" + Date.now(),
            name: name,
            table: sanitizeText(tableEl && tableEl.value) || "-",
            status: "未到"
          });
          nameEl.value = "";
          tableEl.value = "";
          renderSeating();
          saveState();
        });

        document.getElementById("seatingList").addEventListener("click", function (e) {
          const btn = e.target.closest("[data-seating-id]");
          if (!btn) return;
          const guest = state.seating.find(function (g) { return g.id === btn.getAttribute("data-seating-id"); });
          if (!guest) return;
          guest.status = guest.status === "已經到" ? "未到" : "已經到";
          renderSeating();
          saveState();
        });

        document.getElementById("addTeaBtn").addEventListener("click", function () {
          const input = document.getElementById("teaTitleInput");
          const title = sanitizeText(input && input.value);
          if (!title) return;
          state.tea.push({ id: "t_" + Date.now(), title: title, done: false });
          input.value = "";
          renderTea();
          saveState();
        });

        document.getElementById("teaList").addEventListener("click", function (e) {
          const btn = e.target.closest("[data-tea-id]");
          if (!btn) return;
          const item = state.tea.find(function (t) { return t.id === btn.getAttribute("data-tea-id"); });
          if (!item) return;
          item.done = !item.done;
          renderTea();
          saveState();
        });

        document.getElementById("addSupplyBtn").addEventListener("click", function () {
          const input = document.getElementById("supplyTitleInput");
          const title = sanitizeText(input && input.value);
          if (!title) return;
          state.supplies.push({ id: "p_" + Date.now(), title: title, checked: false });
          input.value = "";
          renderSupplies();
          saveState();
        });

        document.getElementById("suppliesList").addEventListener("click", function (e) {
          const btn = e.target.closest("[data-supply-id]");
          if (!btn) return;
          const item = state.supplies.find(function (s) { return s.id === btn.getAttribute("data-supply-id"); });
          if (!item) return;
          item.checked = !item.checked;
          renderSupplies();
          saveState();
        });

        document.getElementById("unlockAngbaoBtn").addEventListener("click", function () {
          const input = document.getElementById("angbaoPassInput");
          const err = document.getElementById("angbaoErr");
          if (input && input.value.trim() === ANP_PASS) {
            state.angbaoUnlocked = true;
            if (err) err.textContent = "";
            input.value = "";
            renderAngbao();
            saveState();
          } else if (err) {
            err.textContent = "密碼錯誤，請重試。";
          }
        });

        document.getElementById("lockAngbaoBtn").addEventListener("click", function () {
          state.angbaoUnlocked = false;
          renderAngbao();
          saveState();
        });

        document.getElementById("addAngbaoBtn").addEventListener("click", function () {
          const nameInput = document.getElementById("angbaoNameInput");
          const amountInput = document.getElementById("angbaoAmountInput");
          const name = sanitizeText(nameInput && nameInput.value);
          const amount = Number(amountInput && amountInput.value);
          if (!name || isNaN(amount)) return;
          state.angbao.push({ id: "a_" + Date.now(), name: name, amount: amount });
          nameInput.value = "";
          amountInput.value = "";
          renderAngbao();
          saveState();
        });
      }

      renderAll();
      bindEvents();
      switchTab(state.activeTab || "rundown");
    })();
  </script>
</body>
</html>
